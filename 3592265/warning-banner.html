<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warning banner screenshots</title>
    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1920px;
        margin: auto;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
        border: 1px solid #ccc;
      }
      h2 {
        margin: 32px 0 8px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Warning banner screenshots</h1>
      <h2>1920 px</h2>
      <img
        src="screenshots/proposed-fix-square-1920.png"
        width="1920"
        height="996"
        alt="Canvas editor at 1920 pixels wide with the warning banner below the toolbar"
      />
      <h2>1280 px</h2>
      <img
        src="screenshots/proposed-fix-square-1280.png"
        width="1280"
        height="800"
        alt="Canvas editor at 1280 pixels wide with the warning banner wrapped onto two lines"
      />
      <h2>1024 px</h2>
      <img
        src="screenshots/proposed-fix-square-1024.png"
        width="1024"
        height="800"
        alt="Canvas editor at 1024 pixels wide with the warning banner wrapped onto two lines"
      />
    </main>
  </body>
</html>

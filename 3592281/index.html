<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Before and after videos for Canvas work item 3592281: the editor preview position after switching to a shorter page."
    />
    <title>Editor preview position comparison</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101518;
        --text: #edf1ec;
        --muted: #b0bdbf;
        --amber: #f4c274;
        --line: #344249;
        --green: #b2d8bb;
        --red: #f2a7a2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          17px/1.6 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 1400px;
        margin: auto;
        padding: 40px 16px;
      }
      h1 {
        font-size: clamp(24px, 4vw, 34px);
        line-height: 1.2;
        margin: 8px 0 24px;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--amber);
      }
      .compare {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }
      @media (max-width: 900px) {
        .compare {
          grid-template-columns: 1fr;
        }
      }
      figure {
        margin: 0;
      }
      video {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 8px;
        border: 1px solid var(--line);
      }
      video:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--amber);
        outline-offset: 4px;
      }
      .label {
        display: inline-block;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        padding: 2px 12px;
        border-radius: 999px;
        margin-bottom: 10px;
      }
      .before {
        background: #3b1f1d;
        color: var(--red);
      }
      .after {
        background: #1d3324;
        color: var(--green);
      }
      .note {
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 15px;
      }
      a {
        color: var(--amber);
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Canvas · Work item 3592281</div>
      <h1>Pages panel: long page → short page → long page</h1>
      <div class="compare">
        <figure>
          <span class="label before">Before</span>
          <video
            controls
            playsinline
            preload="metadata"
            poster="videos/pages-panel-before-poster.png"
            aria-label="Before the fix: the short page's top ends up 370 pixels above the editor pane"
          >
            <source src="videos/pages-panel-before.mp4" type="video/mp4" />
            <track
              kind="captions"
              src="videos/pages-panel-before.vtt"
              srclang="en"
              label="Descriptive milestones"
            />
          </video>
        </figure>
        <figure>
          <span class="label after">After</span>
          <video
            controls
            playsinline
            preload="metadata"
            poster="videos/pages-panel-after-poster.png"
            aria-label="After the fix: the short page's top sits 50 pixels below the top of the editor pane"
          >
            <source src="videos/pages-panel-after.mp4" type="video/mp4" />
            <track
              kind="captions"
              src="videos/pages-panel-after.vtt"
              srclang="en"
              label="Descriptive milestones"
            />
          </video>
        </figure>
      </div>
      <p class="note">
        Local test pages; the short page was opened once beforehand, so its data
        was cached.
        <a href="scroll-anchoring-decision/">Evidence and details</a>
      </p>
    </main>
  </body>
</html>
